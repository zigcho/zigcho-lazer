name: lazer clients

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lazer-clients-${{ github.ref }}
  cancel-in-progress: true

env:
  OSU_REVISION: aaa75b7c0a9f21d558ce84cd0ffac6c739bad8e7
  CLIENT_TEST_FILTER: FullyQualifiedName~TrustedDomainOnlineStoreTest|FullyQualifiedName~PollingChatClientTest|FullyQualifiedName~ZigchoPollingPresenceTest|FullyQualifiedName~ZigchoPlaylistRoomResponseTest|FullyQualifiedName~ZigchoProfileMedalsTest|FullyQualifiedName~ZigchoProfileResponseTest|FullyQualifiedName~ZigchoStaticRouteResponseTest|FullyQualifiedName~TestShowRefreshesSearch|FullyQualifiedName~TestSingleRatingBucket|FullyQualifiedName~TestZigchoMedalsRender|FullyQualifiedName~ZigchoLeaderboardAvailabilityTest|FullyQualifiedName~ZigchoLeaderboardModsTest|FullyQualifiedName~ZigchoRealtimeServicePolicyTest|FullyQualifiedName~ZigchoScoreResponseTest|FullyQualifiedName~ZigchoBuildVersionTest

jobs:
  client-tests:
    name: patch and client tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: check out the client source
        uses: actions/checkout@v6

      - name: check out pinned osu client
        uses: actions/checkout@v6
        with:
          repository: ppy/osu
          ref: ${{ env.OSU_REVISION }}
          path: work/osu-client
          persist-credentials: false

      - name: install dotnet 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: apply and test the client changes
        run: |
          ./apply-endpoints.sh work/osu-client
          git -C work/osu-client diff --check
          dotnet test work/osu-client/osu.Game.Tests/osu.Game.Tests.csproj -c Release --filter "$CLIENT_TEST_FILTER"

      - name: verify player-facing identity
        run: |
          grep -Fq 'zigcho!lazer' work/osu-client/osu.Game/Overlays/DevBuildBanner.cs
          grep -Fq 'playableBeatmap.BeatmapInfo.OnlineID = -1' work/osu-client/osu.Game/Screens/Edit/Submission/SubmissionBeatmapExporter.cs
          grep -Fq 'achievement.ImageUrl' work/osu-client/osu.Game/Overlays/Profile/Sections/MedalsSection.cs
          grep -Fq 'https://a.kai.ovh/' work/osu-client/osu.Game/Users/ZigchoProfileMedia.cs
          grep -Fq 'https://assets.ppy.sh/medals/web/' work/osu-client/osu.Game/Users/ZigchoProfileMedia.cs
          grep -Fq 'authentication.Revoke();' work/osu-client/osu.Game/Online/API/APIAccess.cs
          grep -Fq '/oauth/revoke' work/osu-client/osu.Game/Online/API/OAuth.cs
          if grep -R -n -E 'DEVELOPER BUILD|osu! \(development\)' work/osu-client/osu.Game work/osu-client/osu.Desktop; then
            exit 1
          fi
          if grep -n -E 'https://[as]\.ppy\.sh' \
            work/osu-client/osu.Game/Users/Drawables/DrawableAvatar.cs \
            work/osu-client/osu.Game/Users/Medal.cs \
            work/osu-client/osu.Game/Overlays/Profile/Sections/Recent/MedalIcon.cs; then
            exit 1
          fi

  windows-x64:
    name: windows x64
    needs: client-tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: check out the client source
        uses: actions/checkout@v6

      - name: check out pinned osu client
        uses: actions/checkout@v6
        with:
          repository: ppy/osu
          ref: ${{ env.OSU_REVISION }}
          path: work/osu-client
          persist-credentials: false

      - name: install dotnet 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: install python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: build and verify the portable client
        shell: pwsh
        run: ./build-windows.ps1 -Checkout work/osu-client -OutputDirectory artifacts/lazer

      - name: upload the Windows package
        uses: actions/upload-artifact@v7
        with:
          name: zigcho-lazer-windows-x64
          path: artifacts/lazer/*windows-x64*
          if-no-files-found: error
          retention-days: 30

  macos-arm64:
    name: macos arm64
    needs: client-tests
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: check out the client source
        uses: actions/checkout@v6

      - name: check out pinned osu client
        uses: actions/checkout@v6
        with:
          repository: ppy/osu
          ref: ${{ env.OSU_REVISION }}
          path: work/osu-client
          persist-credentials: false

      - name: install dotnet 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: build and verify the portable client
        shell: bash
        run: |
          set -euo pipefail
          ./apply-endpoints.sh work/osu-client
          version=$(tr -d '\r\n' < client-version.txt)
          numeric=${version%%-*}.0
          publish="$RUNNER_TEMP/zigcho-lazer-macos-arm64"
          dotnet publish work/osu-client/osu.Desktop/osu.Desktop.csproj \
            -c Release -r osx-arm64 --self-contained true -o "$publish" \
            -p:Version="$version" -p:FileVersion="$numeric" -p:AssemblyVersion="$numeric" \
            -p:InformationalVersion="$version+zigcho.build.${GITHUB_RUN_NUMBER}.client.${GITHUB_SHA:0:8}.osu.${OSU_REVISION:0:8}" \
            -p:DebugType=None -p:DebugSymbols=false
          python3 package-desktop.py \
            --publish-dir "$publish" --output-dir artifacts/lazer --runtime macos-arm64 \
            --version "$version" --build-number "$GITHUB_RUN_NUMBER" --client-revision "$GITHUB_SHA" --osu-revision "$OSU_REVISION" \
            --zigcho-license LICENSE --osu-license work/osu-client/LICENCE

      - name: upload the macOS package
        uses: actions/upload-artifact@v7
        with:
          name: zigcho-lazer-macos-arm64
          path: artifacts/lazer/*macos-arm64*
          if-no-files-found: error
          retention-days: 30

  linux-x64:
    name: linux x64
    needs: client-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: check out the client source
        uses: actions/checkout@v6

      - name: check out pinned osu client
        uses: actions/checkout@v6
        with:
          repository: ppy/osu
          ref: ${{ env.OSU_REVISION }}
          path: work/osu-client
          persist-credentials: false

      - name: install dotnet 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: build and verify the portable client
        run: |
          set -euo pipefail
          ./apply-endpoints.sh work/osu-client
          version=$(tr -d '\r\n' < client-version.txt)
          numeric=${version%%-*}.0
          publish="$RUNNER_TEMP/zigcho-lazer-linux-x64"
          dotnet publish work/osu-client/osu.Desktop/osu.Desktop.csproj \
            -c Release -r linux-x64 --self-contained true -o "$publish" \
            -p:Version="$version" -p:FileVersion="$numeric" -p:AssemblyVersion="$numeric" \
            -p:InformationalVersion="$version+zigcho.build.${GITHUB_RUN_NUMBER}.client.${GITHUB_SHA:0:8}.osu.${OSU_REVISION:0:8}" \
            -p:DebugType=None -p:DebugSymbols=false
          python3 package-desktop.py \
            --publish-dir "$publish" --output-dir artifacts/lazer --runtime linux-x64 \
            --version "$version" --build-number "$GITHUB_RUN_NUMBER" --client-revision "$GITHUB_SHA" --osu-revision "$OSU_REVISION" \
            --zigcho-license LICENSE --osu-license work/osu-client/LICENCE

      - name: upload the Linux package
        uses: actions/upload-artifact@v7
        with:
          name: zigcho-lazer-linux-x64
          path: artifacts/lazer/*linux-x64*
          if-no-files-found: error
          retention-days: 30
