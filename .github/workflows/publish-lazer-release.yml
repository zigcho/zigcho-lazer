name: publish lazer release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: successful lazer clients run id
        required: true
        type: string
      version:
        description: client version without a leading v
        required: true
        type: string
      revision:
        description: exact client commit built by the source run
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: verify and publish the client artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: validate the source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id }}
          SOURCE_REVISION: ${{ inputs.revision }}
          CLIENT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CLIENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" --jq .name)" = "lazer clients"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" --jq .status)" = "completed"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" --jq .conclusion)" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" --jq .head_sha)" = "$SOURCE_REVISION"
          build_number=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" --jq .run_number)
          [[ "$build_number" =~ ^[1-9][0-9]*$ ]]
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: check out the exact release source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - name: download the windows-x64 artifact
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: zigcho-lazer-windows-x64
          path: artifacts/lazer

      - name: download the macos-arm64 artifact
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: zigcho-lazer-macos-arm64
          path: artifacts/lazer

      - name: download the linux-x64 artifact
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: zigcho-lazer-linux-x64
          path: artifacts/lazer

      - name: verify every package and checksum
        env:
          BUILD_NUMBER: ${{ steps.source.outputs.build_number }}
          CLIENT_VERSION: ${{ inputs.version }}
          SOURCE_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          cd artifacts/lazer
          test "$(tr -d '\r\n' < ../../client-version.txt)" = "$CLIENT_VERSION"
          test -f "zigcho-lazer-${CLIENT_VERSION}-windows-x64.zip"
          test -f "zigcho-lazer-${CLIENT_VERSION}-macos-arm64.zip"
          test -f "zigcho-lazer-${CLIENT_VERSION}-linux-x64.zip"
          upstream=$(tr -d '\r\n' < ../../upstream-commit.txt)
          for checksum in *.sha256; do
            sha256sum --check "$checksum"
          done
          test "$(find . -maxdepth 1 -type f -name '*.sha256' | awk 'END { print NR }')" = 3
          for runtime in windows-x64 macos-arm64 linux-x64; do
            metadata=$(unzip -p "zigcho-lazer-${CLIENT_VERSION}-${runtime}.zip" '*/VERSION.txt')
            printf '%s\n' "$metadata" | grep -Fqx "client_version=${CLIENT_VERSION}"
            printf '%s\n' "$metadata" | grep -Fqx "build_number=${BUILD_NUMBER}"
            printf '%s\n' "$metadata" | grep -Fqx "client_revision=${SOURCE_REVISION}"
            printf '%s\n' "$metadata" | grep -Fqx "osu_revision=${upstream}"
          done

      - name: publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_VERSION: ${{ inputs.version }}
          SOURCE_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          tag="lazer-v${CLIENT_VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release already exists: $tag" >&2
            exit 1
          fi
          gh release create "$tag" artifacts/lazer/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_REVISION" \
            --title "zigcho!lazer ${CLIENT_VERSION}" \
            --prerelease \
            --notes-file "updates/${CLIENT_VERSION}.md"
